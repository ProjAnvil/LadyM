[project]
name = "ladym-wrapper"
version = "0.1.0"
description = "Python wrapper for the ladyM Go engine (thin MCP stdio client over `ladym serve`)"
readme = "README.md"
authors = [
    { name = "yuhaochen", email = "cyh278889789@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # LongMemEval benchmark harness (ladym_wrapper.longmemeval): requests for
    # the dataset download; numpy/openai/backoff/tqdm for the vendored
    # upstream_eval scripts and the Phase-B answer LLM.
]
