# LadyM enterprise gateway — the ONLY node exposed to the host in
# docker-compose.enterprise.yml (host port 18080 -> container 80).
# Routes:
#   /api/*    -> ladym_api upstream (api-1 + api-2, load balanced)
#   /healthz  -> ladym_api upstream (probe; unauthenticated upstream)
#   /         -> console:8080 (ladymconsole: Vue SPA + full /api data-plane)
# /api/metrics sits under the /api/ prefix and is proxied naturally.
# No WebSocket endpoints exist in the data-plane, so no upgrade headers.

upstream ladym_api {
    # Default round-robin across the two api nodes (demonstrates horizontal
    # scaling). Uncomment for least-connections balancing instead:
    # least_conn;
    server api-1:8080;
    server api-2:8080;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://ladym_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://ladym_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://console:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
