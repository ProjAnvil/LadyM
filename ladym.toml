# Capture identity example. Existing databases are never migrated automatically.
# Stop database users and back up the database/WAL before explicitly opting in.
# Canonical identities cannot recover paths lost by legacy basename capture.
# Reverting the mode does not move or merge memories between workspaces.
[capture]
identity_mode = "legacy" # opt in with "canonical" or LADYM_CAPTURE_IDENTITY_MODE

[system2]
budgeted_enabled = false
max_candidates = 50
max_calls = 8
max_reserved_bytes = 8192
max_wall_s = 30
concurrency = 1 # 1..4
lease_s = 60
max_attempts = 3 # 1..3, including crashed lease attempts
