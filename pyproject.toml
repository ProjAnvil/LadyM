[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ladym"
version = "0.2.1"
description = "LadyM — a brain-inspired, multi-tier memory framework for LLM agents and codebase RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ladyM" }]
keywords = ["memory", "llm", "agent", "rag", "codebase", "mcp", "tree-sitter", "langgraph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Core deps are intentionally lean; heavyweight providers are optional extras.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "sqlmodel>=0.0.16",
    "cryptography>=42.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.7"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
mcp = ["mcp>=1.0"]
langgraph = ["langgraph>=1.0", "langchain-core>=0.3"]
llm = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-ollama>=0.2",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
codeindex = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.1"]
# Aggregate of every user-facing extra (excludes `dev`). Self-referential so the
# individual extras remain the single source of truth.
all = ["ladym[web,llm,local,mcp,openai,anthropic,langgraph,codeindex]"]
dev = [
    "ladym[codeindex]",  # so `pip install -e '.[dev]'` can run code-indexing tests
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ladym = "ladym.cli:main"

[project.urls]
Documentation = "https://github.com/ProjAnvil/LadyM"

[tool.hatch.build.targets.wheel]
packages = ["src/ladym"]

[tool.hatch.build.targets.sdist]
# Keep the sdist lean: ship source + README + ARCHITECTURE + tests, but exclude
# local IDE/agent settings, lock files, and runtime databases.
exclude = [
    ".claude",
    ".superpowers",
    "uv.lock",
    "docs/superpowers",
    "*.ladym.db",
    "*.ladym.db-*",
    "ladym.db",
    "ladym.db-*",
    "e2e.ladym.db",
    "e2e.ladym.db-*",
    ".coverage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end integration tests",
    "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long lines are fine in test fixtures

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
